name: Shop ResoFlex Preview Build Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - "tsconfig.json"
      - ".github/workflows/shop-resoflex-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-resoflex-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frozen-lockfile production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Resolve dependencies and refresh lockfile
        run: bun install
      - name: Build production bundle
        run: bun run build
      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-resoflex-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
